
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <main>

        <h1>Advanced CSS Selectors</h1>

        <section class="items">

            <h2>Items</h2>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Java</li>
            </ul>

        </section>

        <section class="form-section">

            <h2>Form</h2>

            <input type="text" placeholder="Enter your name">

            <input type="email" placeholder="Enter your email">

            <a href="https://www.google.com">Secure Link</a>

        </section>

        <section class="combinators">

            <h2>Combinators</h2>

            <div>
                <p>Child paragraph</p>
                <span>Span element</span>
                <p>Another paragraph</p>
            </div>

        </section>

    </main>

</body>
</html>
