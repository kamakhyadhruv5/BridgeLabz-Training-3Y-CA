
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <main>

        <h1>CSS Box Model</h1>

        <section class="model">

            <div class="margin-layer">

                <div class="border-layer">

                    <div class="padding-layer">

                        <div class="content-layer">
                            Content
                        </div>

                    </div>

                </div>

            </div>

        </section>

        <section class="description">
            <p><strong>Margin:</strong> Space outside the border.</p>
            <p><strong>Border:</strong> Line surrounding the padding.</p>
            <p><strong>Padding:</strong> Space between content and border.</p>
            <p><strong>Content:</strong> Actual text or element content.</p>
        </section>

        <section class="comparison">

            <div class="default-box">
                Default Box Sizing
            </div>

            <div class="border-box">
                Border-Box Sizing
            </div>

        </section>

    </main>

</body>
</html>
