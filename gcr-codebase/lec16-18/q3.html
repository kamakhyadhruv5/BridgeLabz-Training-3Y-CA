
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <header>
        <h1>CSS Gradients</h1>
    </header>

    <main>

        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>
                This section uses a linear-gradient background.
                The colors change along a straight line.
            </p>
        </section>

        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>
                This section uses a radial-gradient background.
                The colors spread outward from a central point.
            </p>
        </section>

    </main>

    <footer>
        <p>Gradient Background Demonstration</p>
    </footer>

</body>
</html>
