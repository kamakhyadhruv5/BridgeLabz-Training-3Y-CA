<!DOCTYPE html>
<html>
<head>
    <title>Conference Schedule</title>
</head>
<body>

    <header>
        <h1>Technology Conference 2026</h1>
    </header>

    <main>

        <table border="1">

            <caption>Conference Schedule</caption>

            <!-- Table Header -->
            <thead>
                <tr>
                    <th>Session</th>
                    <th>Time</th>
                    <th>Topic</th>
                    <th>Speaker</th>
                </tr>
            </thead>

            <!-- Table Body -->
            <tbody>
                <tr>
                    <td rowspan="2">Morning</td>
                    <td>9:00 AM</td>
                    <td>Artificial Intelligence</td>
                    <td>Dr. Sharma</td>
                </tr>

                <tr>
                    <td>11:00 AM</td>
                    <td>Cloud Computing</td>
                    <td>Mr. Verma</td>
                </tr>

                <tr>
                    <td>Afternoon</td>
                    <td>2:00 PM</td>
                    <td>Cyber Security</td>
                    <td>Ms. Gupta</td>
                </tr>

                <tr>
                    <td>Evening</td>
                    <td>6:00 PM</td>
                    <td>Future of Technology</td>
                    <td>Dr. Singh</td>
                </tr>
            </tbody>

            <!-- Table Footer -->
            <tfoot>
                <tr>
                    <td colspan="4">
                        Conference ends at 8:00 PM
                    </td>
                </tr>
            </tfoot>

        </table>

    </main>

</body>
</html>
