
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

<header>
    <h1>Responsive CSS Cheat Sheet</h1>
</header>

<main>
    <section class="cheat-sheet">

        <article class="topic">
            <h2>Filters</h2>
            <p>filter: grayscale(100%);</p>
        </article>

        <article class="topic">
            <h2>Media Queries</h2>
            <p>@media (max-width: 700px)</p>
        </article>

        <article class="topic">
            <h2>Responsive Design</h2>
            <p>Designs that adapt to different screen sizes.</p>
        </article>

        <article class="topic">
            <h2>Typography</h2>
            <p>font-size: clamp(1rem, 2vw, 2rem);</p>
        </article>

    </section>
