<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

<main>
    <section class="principles">

        <article class="principle">
            <h2>Fluid Layouts</h2>
            <p>
                Fluid layouts use flexible units so content adapts
                to different screen sizes.
            </p>
            <code>width: 100%;</code>
        </article>

        <article class="principle">
            <h2>Flexible Media</h2>
            <p>
                Images and media resize according to the available width.
            </p>
            <code>max-width: 100%;</code>
        </article>

        <article class="principle">
            <h2>Breakpoints</h2>
            <p>
                Breakpoints apply different layouts at different widths.
            </p>
            <code>@media (max-width: 600px)</code>
        </article>

    </section>
</main>

</body>
</html>
