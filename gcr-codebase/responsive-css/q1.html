
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

<header>
    <h1>Image Filter Gallery</h1>
</header>

<main>
    <section class="gallery">
        <figure>
            <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain">
            <figcaption>Blur</figcaption>
        </figure>

        <figure>
            <img class="grayscale" src="https://picsum.photos/id/1016/500/350" alt="Nature">
            <figcaption>Grayscale</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="https://picsum.photos/id/1025/500/350" alt="Dog">
            <figcaption>Sepia</figcaption>
        </figure>

        <figure>
            <img class="brightness" src="https://picsum.photos/id/1035/500/350" alt="River">
            <figcaption>Brightness</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="https://picsum.photos/id/1043/500/350" alt="Forest">
            <figcaption>Contrast</figcaption>
        </figure>

        <figure>
            <img class="hue" src="https://picsum.photos/id/1069/500/350" alt="Landscape">
            <figcaption>Hue Rotate</figcaption>
        </figure>
    </section>
</main>

<footer>
    <p>Responsive Image Filter Gallery</p>
</footer>

</body>
</html>
