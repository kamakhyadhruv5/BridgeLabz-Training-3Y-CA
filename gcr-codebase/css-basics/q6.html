<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

    <h1>My Photo Gallery</h1>

    <main class="gallery">

        <figure>
            <img src="image1.jpg" alt="Mountain">
            <figcaption>Beautiful Mountain</figcaption>
        </figure>

        <figure>
            <img src="image2.jpg" alt="Beach">
            <figcaption>Sunny Beach</figcaption>
        </figure>

        <figure>
            <img src="image3.jpg" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="image4.jpg" alt="City">
            <figcaption>Modern City</figcaption>
        </figure>

        <figure>
            <img src="image5.jpg" alt="Lake">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure>
            <img src="image6.jpg" alt="Sunset">
            <figcaption>Beautiful Sunset</figcaption>
        </figure>

    </main>

</body>
</html>
