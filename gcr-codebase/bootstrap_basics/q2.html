<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">

<header class="bg-dark text-white text-center p-5">
    <div class="container">
        <h1 class="fw-bold">Alex Morgan</h1>
        <p class="lead mb-0">Web Developer & UI Designer</p>
    </div>
</header>

<main>
    <section class="container text-center mt-4 mb-3">
        <img src="https://picsum.photos/id/64/250/250"
             class="img-fluid rounded-circle profile-img"
             alt="Profile">

        <h2 class="fw-bold mt-4">Hello, I'm Alex</h2>

        <p class="lead">
            I create clean, responsive and user-friendly websites
            for modern businesses.
        </p>

        <div class="mt-4">
            <a href="#" class="btn btn-primary me-2">Hire Me</a>
            <a href="#" class="btn btn-outline-dark">Download CV</a>
        </div>
    </section>

    <section class="container p-5">
        <h3 class="text-center fw-bold mb-3">Contact Me</h3>

        <form class="mx-auto contact-form">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control" rows="4" placeholder="Write your message"></textarea>
            </div>

            <button type="submit" class="btn btn-dark">Send Message</button>
        </form>
    </section>
</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 Alex Morgan</p>
</footer>

</body>
</html>
