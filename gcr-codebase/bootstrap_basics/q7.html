<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q7.css">
</head>
<body>

<main class="container py-5">

    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold">Task Tracker</h1>
            <p class="text-muted mb-0">Manage your daily tasks</p>
        </div>

        <span class="badge text-bg-danger fs-6">
            4 Pending
        </span>
    </header>

    <section class="list-group shadow-sm">

        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <h2 class="h6 mb-1">Complete project report</h2>
                <p class="mb-0 text-muted">Due today</p>
            </div>
            <span class="badge text-bg-danger">High</span>
        </div>

        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <h2 class="h6 mb-1">Review pull requests</h2>
                <p class="mb-0 text-muted">Due tomorrow</p>
            </div>
            <span class="badge text-bg-warning">Medium</span>
        </div>

        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <h2 class="h6 mb-1">Update documentation</h2>
                <p class="mb-0 text-muted">Due Friday</p>
            </div>
            <span class="badge text-bg-success">Low</span>
        </div>

        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <h2 class="h6 mb-1">Team meeting preparation</h2>
                <p class="mb-0 text-muted">Due today</p>
            </div>
            <span class="badge text-bg-danger">High</span>
        </div>

    </section>

    <div class="text-center mt-4">
        <button class="btn btn-success">
            Completed <span class="badge text-bg-light">8</span>
        </button>
    </div>

</main>

</body>
</html>
