<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q3.css">
</head>
<body>

<header class="bg-dark text-white text-center py-4">
    <h1>Tech Store</h1>
    <p class="mb-0">Quality products for your digital lifestyle</p>
</header>

<main class="container py-5">
    <h2 class="text-center mb-4">Featured Products</h2>

    <section class="row g-4">

        <div class="col-12 col-sm-6 col-md-3">
            <article class="card h-100 shadow-sm product-card">
                <img src="https://picsum.photos/id/1/400/300" class="card-img-top" alt="Laptop">
                <div class="card-body">
                    <h5 class="card-title">Laptop Pro</h5>
                    <p class="card-text">$899</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </article>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <article class="card h-100 shadow-sm product-card">
                <img src="https://picsum.photos/id/20/400/300" class="card-img-top" alt="Headphones">
                <div class="card-body">
                    <h5 class="card-title">Wireless Headphones</h5>
                    <p class="card-text">$129</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </article>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <article class="card h-100 shadow-sm product-card">
                <img src="https://picsum.photos/id/96/400/300" class="card-img-top" alt="Camera">
                <div class="card-body">
                    <h5 class="card-title">Digital Camera</h5>
                    <p class="card-text">$599</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </article>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <article class="card h-100 shadow-sm product-card">
                <img src="https://picsum.photos/id/160/400/300" class="card-img-top" alt="Smartwatch">
                <div class="card-body">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="card-text">$199</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </article>
        </div>

    </section>
</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 Tech Store</p>
</footer>

</body>
</html>
