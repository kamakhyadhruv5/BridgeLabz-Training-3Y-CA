<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q6.css">
</head>
<body>

<main class="container py-5">

    <section class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h1 class="h3 mb-0">Notifications Dashboard</h1>
        </div>

        <div class="card-body">

            <div class="alert alert-success" role="alert">
                You have received 3 new messages.
            </div>

            <div class="alert alert-info" role="alert">
                Your profile is now 80% complete.
            </div>

            <div class="alert alert-danger" role="alert">
                Your password will expire soon.
            </div>

            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                Remember to verify your email address.

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>

            <section class="summary bg-light border rounded p-4 mt-4">
                <h2 class="h4">Summary</h2>
                <p class="mb-0">
                    You have 3 new messages, 2 pending tasks and 1 security warning.
                </p>
            </section>

        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
