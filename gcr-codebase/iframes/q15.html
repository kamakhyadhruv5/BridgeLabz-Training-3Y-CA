<!DOCTYPE html>
<html>
<head>
    <title>Payment Form</title>
</head>
<body>

    <h1>Payment Form</h1>

    <form>

        <!-- Cardholder Name -->
        <label for="cardholder">Cardholder Name:</label>
        <input
            type="text"
            id="cardholder"
            name="cardholder"
            required>

        <br><br>

        <!-- Card Number -->
        <label for="card-number">Card Number:</label>
        <input
            type="text"
            id="card-number"
            name="card-number"
            required>

        <br><br>

        <!-- Expiry Date -->
        <label for="expiry">Expiry Date:</label>
        <input
            type="month"
            id="expiry"
            name="expiry"
            required>

        <br><br>

        <!-- CVV -->
        <label for="cvv">CVV:</label>
        <input
            type="password"
            id="cvv"
            name="cvv"
            required>

        <br><br>

        <input type="submit" value="Pay Now">

    </form>

</body>
</html>
