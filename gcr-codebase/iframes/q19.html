<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>
<body>

    <h1>Secure Form</h1>

    <!-- autocomplete="off" prevents browsers from automatically filling form data -->
    <form autocomplete="off">

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            required>

        <br><br>

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            required>

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <!-- Security explanation -->
    <p>
        Turning off autocomplete can reduce the chance of sensitive
        information being automatically stored or displayed by the browser.
        However, it should not be considered a complete security measure.
    </p>

</body>
</html>
