<!DOCTYPE html>
<html>
<head>
    <title>Form Page</title>
</head>
<body>

    <h1>Simple Form</h1>

    <!--
        target="resultFrame" sends the submitted form response
        to the iframe named resultFrame.
    -->
    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Name:</label>

        <input
            type="text"
            id="name"
            name="name">

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- Result page will load here after submission -->
    <iframe
        src=""
        name="resultFrame"
        width="500"
        height="200"
        title="Form Result">
    </iframe>

</body>
</html>
