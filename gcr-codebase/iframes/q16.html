<!DOCTYPE html>
<html>
<head>
    <title>URI Encoding</title>
</head>
<body>

    <h1>URI Encoding Example</h1>

    <p>Encoded search URL:</p>

    <!-- Spaces are represented using %20 and & is encoded as %26 -->
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search for HTML & CSS
    </a>

</body>
</html>
