<!DOCTYPE html>
<html>
<head>
    <title>Frameset Website</title>
</head>

<!-- Top frame contains navigation and bottom frame contains welcome message -->
<frameset rows="25%,75%">

    <!-- Navigation frame -->
    <frame src="navigation.html" name="navigation">

    <!-- Welcome message frame -->
    <frame src="welcome.html" name="content">

</frameset>

</html>
