<!DOCTYPE html>
<html>

<head>

    <!--
        The title defines the name displayed in the browser tab.
    -->
    <title>Important Head Elements</title>


    <!--
        The charset specifies the character encoding of the webpage.
    -->
    <meta charset="UTF-8">


    <!--
        The description provides a short description of the webpage.
    -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements.">


    <!--
        The author specifies who created the webpage.
    -->
    <meta
        name="author"
        content="Dhruv Kamakhya">


    <!--
        The base element defines the base URL for relative URLs
        used throughout the webpage.
    -->
    <base href="https://example.com/">


    <!--
        The link element can connect the webpage to an external resource,
        such as a favicon.
    -->
    <link rel="icon" href="favicon.ico">


    <!--
        The style element is used for CSS.
        It is empty here because this assignment focuses on HTML.
    -->
    <style>
    </style>


    <!--
        The script element is used for JavaScript.
        It is empty here as required.
    -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This page demonstrates commonly used elements inside the
        HTML head section.
    </p>

</body>

</html>
