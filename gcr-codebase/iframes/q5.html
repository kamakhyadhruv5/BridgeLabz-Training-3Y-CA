<!DOCTYPE html>
<html>
<head>

    <!-- Specifies UTF-8 character encoding -->
    <meta charset="UTF-8">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Dhruv Kamakhya">

    <!-- Makes the webpage responsive to the device width -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Webpage title -->
    <title>UTF-8 Example</title>

</head>
<body>

    <h1>UTF-8 Encoding Example</h1>

    <p>
        English: Hello, welcome to my webpage.
    </p>

    <p>
        Hindi: नमस्ते, मेरी वेबसाइट में आपका स्वागत है।
    </p>

    <p>
        Japanese: こんにちは、私のウェブページへようこそ。
    </p>

</body>
</html>
