<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>

    <h1>Feedback Form</h1>

    <form method="post" action="#">

        <!-- Feedback textarea -->
        <label for="feedback">Your Feedback:</label>
        <br>

        <textarea
            id="feedback"
            name="feedback"
            rows="6"
            cols="40">
        </textarea>

        <br><br>

        <!-- Rating -->
        <p>Rate your experience:</p>

        <input
            type="radio"
            id="good"
            name="rating"
            value="good">

        <label for="good">Good</label>

        <br>

        <input
            type="radio"
            id="average"
            name="rating"
            value="average">

        <label for="average">Average</label>

        <br>

        <input
            type="radio"
            id="poor"
            name="rating"
            value="poor">

        <label for="poor">Poor</label>

        <br><br>

        <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
