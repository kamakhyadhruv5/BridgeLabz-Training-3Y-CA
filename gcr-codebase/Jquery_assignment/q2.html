
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Highlight</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
    <h1>Online Shopping Store</h1>
</header>

<main>
    <section>
        <h2>Our Products</h2>

        <article class="product" data-stock="yes" data-discount="20">
            <h3>Laptop</h3>
            <p>Price: ₹50000</p>
            <p class="details">16GB RAM, 512GB SSD</p>
            <button class="favorite">♥ Favorite</button>
        </article>

        <article class="product" data-stock="no" data-discount="0">
            <h3>Smartphone</h3>
            <p>Price: ₹20000</p>
            <p class="details">128GB Storage, 8GB RAM</p>
            <button class="favorite">♥ Favorite</button>
        </article>

        <article class="product" data-stock="yes" data-discount="15">
            <h3>Headphones</h3>
            <p>Price: ₹3000</p>
            <p class="details">Wireless noise cancellation</p>
            <button class="favorite">♥ Favorite</button>
        </article>

        <article class="product" data-stock="yes" data-discount="0">
            <h3>Keyboard</h3>
            <p>Price: ₹1500</p>
            <p class="details">Mechanical keyboard</p>
            <button class="favorite">♥ Favorite</button>
        </article>

        <article class="product" data-stock="yes" data-discount="10">
            <h3>Mouse</h3>
            <p>Price: ₹800</p>
            <p class="details">Wireless gaming mouse</p>
            <button class="favorite">♥ Favorite</button>
        </article>
    </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="q2.js"></script>
</body>
</html>
