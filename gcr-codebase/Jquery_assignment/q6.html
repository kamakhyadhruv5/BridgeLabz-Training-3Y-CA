
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Subscription</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
    <h1>Event Subscription Panel</h1>
</header>

<main>
<section>
    <h2>Manage Your Subscriptions</h2>

    <div id="subscriptions">
        <article class="item">
            <span>Technology Updates</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
        </article>

        <article class="item">
            <span>Sports Updates</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
        </article>

        <article class="item">
            <span>Education Updates</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
        </article>

        <article class="item">
            <span>Gaming Updates</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
        </article>

        <article class="item">
            <span>Business Updates</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
        </article>
    </div>

    <h3>Add New Topic</h3>
    <input type="text" id="topicInput" placeholder="Enter topic name">
    <button id="addTopic">Add Topic</button>

    <p id="message" aria-live="polite"></p>
</section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="q6.js"></script>
</body>
</html>
