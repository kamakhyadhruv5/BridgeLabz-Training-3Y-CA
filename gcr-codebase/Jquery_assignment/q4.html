
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Special Offers</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
    <h1>Special Offers</h1>
</header>

<main>
<section>
    <article class="banner">
        <h2>Offer 1 - 20% OFF</h2>
        <p>Get 20% off on electronics.</p>
        <button class="hide">Hide</button>
    </article>

    <article class="banner">
        <h2>Offer 2 - 30% OFF</h2>
        <p>Get 30% off on clothing.</p>
        <button class="hide">Hide</button>
    </article>

    <article class="banner">
        <h2>Offer 3 - Buy One Get One</h2>
        <p>Special offer on selected products.</p>
        <button class="hide">Hide</button>
    </article>

    <article class="banner">
        <h2>Offer 4 - Free Delivery</h2>
        <p>Free delivery on orders above ₹1000.</p>
        <button class="hide">Hide</button>
    </article>

    <article class="banner">
        <h2>Offer 5 - Festival Sale</h2>
        <p>Special festival discounts available.</p>
        <button class="hide">Hide</button>
    </article>

    <button id="show">Show All</button>
    <button id="slideUp">Slide Up</button>
    <button id="slideDown">Slide Down</button>
    <button id="fadeOut">Fade Out</button>
    <button id="fadeIn">Fade In</button>
</section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="q4.js"></script>
</body>
</html>
