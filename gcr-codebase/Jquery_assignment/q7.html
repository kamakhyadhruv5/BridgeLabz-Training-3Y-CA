
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Courses</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
    <h1>Online Learning Platform</h1>
</header>

<main>
<section>
    <h2>Search Courses</h2>

    <input type="text" id="search" placeholder="Search courses...">
    <button id="clear">Clear Search</button>

    <p id="count" aria-live="polite"></p>

    <div id="courseList">
        <article class="course">Java Programming</article>
        <article class="course">Python Development</article>
        <article class="course">Web Development</article>
        <article class="course">Data Structures</article>
        <article class="course">Cloud Computing</article>
        <article class="course">Machine Learning</article>
    </div>
</section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="q7.js"></script>
</body>
</html>
