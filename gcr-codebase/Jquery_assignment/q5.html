
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Directory</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
    <h1>Company Team Directory</h1>
</header>

<main>
<section id="team">
    <h2>Development Department</h2>

    <div class="department">
        <h3 class="departmentName">Development</h3>

        <article class="manager item">
            <h3>Manager: Rahul</h3>
        </article>

        <article class="employee item">
            <p>Employee: Dhruv</p>
            <button class="contact">Show Contact</button>
            <p class="contactInfo">Email: dhruv@example.com</p>
        </article>

        <article class="employee item">
            <p>Employee: Aman</p>
            <button class="contact">Show Contact</button>
            <p class="contactInfo">Email: aman@example.com</p>
        </article>
    </div>

    <h2>Design Department</h2>

    <div class="department">
        <h3 class="departmentName">Design</h3>

        <article class="manager item">
            <h3>Manager: Priya</h3>
        </article>

        <article class="employee item">
            <p>Employee: Sneha</p>
            <button class="contact">Show Contact</button>
            <p class="contactInfo">Email: sneha@example.com</p>
        </article>

        <article class="employee item">
            <p>Employee: Riya</p>
            <button class="contact">Show Contact</button>
            <p class="contactInfo">Email: riya@example.com</p>
        </article>
    </div>

    <button id="random">Select Random Employee</button>
    <button id="collapse">Collapse/Expand Team</button>
</section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="q5.js"></script>
</body>
</html>
