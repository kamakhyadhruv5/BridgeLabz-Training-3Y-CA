
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

    <header>
        <h1>CSS Selectors Practice</h1>
    </header>

    <main>

        <p>This is an element selector example.</p>

        <p class="special">
            This paragraph uses a class selector.
        </p>

        <p id="unique">
            This paragraph uses an ID selector.
        </p>

        <input type="text" placeholder="Attribute selector">

        <section class="combinators">

            <h2>Combinators</h2>

            <div>
                <p>Direct child paragraph.</p>
                <span>Span element.</span>
                <p>Another paragraph.</p>
            </div>

        </section>

        <a href="#">Example Link</a>

    </main>

    <footer>
        <p>CSS Selector Demonstration</p>
    </footer>

</body>
</html>
