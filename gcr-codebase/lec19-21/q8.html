
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <main>

        <h1>Box-Sizing Comparison</h1>

        <section class="comparison">

            <div class="box default">
                <h2>Default</h2>
                <p>box-sizing: content-box</p>
                <p>Padding and border are added to the width.</p>
            </div>

            <div class="box border">
                <h2>Border Box</h2>
                <p>box-sizing: border-box</p>
                <p>Padding and border are included in the width.</p>
            </div>

        </section>

    </main>

</body>
</html>
