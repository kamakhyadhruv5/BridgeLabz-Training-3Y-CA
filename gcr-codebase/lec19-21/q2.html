
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <main class="container">

        <h1>CSS Tooltips</h1>

        <section class="tooltip-container">

            <div class="tooltip-item">
                <span>Home</span>
                <div class="tooltip">Go to Home</div>
            </div>

            <div class="tooltip-item">
                <span>Search</span>
                <div class="tooltip">Search for content</div>
            </div>

            <div class="tooltip-item">
                <span>Profile</span>
                <div class="tooltip">View your profile</div>
            </div>

            <div class="tooltip-item">
                <span>Settings</span>
                <div class="tooltip">Open settings</div>
            </div>

        </section>

    </main>

</body>
</html>
