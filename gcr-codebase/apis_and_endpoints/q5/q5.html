
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Timetable</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }

        main {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        select {
            padding: 12px;
            width: 100%;
            margin: 15px 0;
        }

        .class-item {
            padding: 15px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-left: 5px solid #334155;
            border-radius: 5px;
        }

        .class-item h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<header>
    <h1>College Timetable Viewer</h1>
</header>

<main>
    <section>

        <h2>Select Day</h2>

        <label for="day">Weekday:</label>

        <select id="day">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
        </select>

        <h2>Today's Classes</h2>

        <div id="timetable" aria-live="polite">
            Select a day to view classes.
        </div>

    </section>
</main>

<script src="q5.js"></script>
</body>
</html>
