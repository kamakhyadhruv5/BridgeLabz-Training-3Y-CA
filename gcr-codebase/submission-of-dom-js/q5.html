<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="gallery" id="gallery">
        <img src="https://picsum.photos/id/1015/300/200" alt="Image 1">
        <img src="https://picsum.photos/id/1025/300/200" alt="Image 2">
        <img src="https://picsum.photos/id/1035/300/200" alt="Image 3">
        <img src="https://picsum.photos/id/1043/300/200" alt="Image 4">
        <img src="https://picsum.photos/id/1050/300/200" alt="Image 5">
        <img src="https://picsum.photos/id/1069/300/200" alt="Image 6">
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" id="modalContent">
            <span id="closeButton">&times;</span>
            <img id="previewImage" src="" alt="Preview">
        </div>
    </div>

    <script src="q5.js"></script>
</body>
</html>
